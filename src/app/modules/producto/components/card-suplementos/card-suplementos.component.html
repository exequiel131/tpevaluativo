<!--productos-->
<div class="card-container">
  <div class="col-lg-3 container" *ngFor="let articulo of suplementoscolecction">
    <div class="card" style="width: 18rem;">
      <img src="{{articulo.imagen}}" class="card-img-top">
      <div class="card-body">
        <h4 class="card-title"><b>{{articulo.nombre}}</b></h4>
        <hr>
        <div class="card-alt">
          <b>
          <h4>{{articulo.alt}}</h4>
        </b> 
        </div>

        <p class="card-text"> <b>${{articulo.precio}}</b> </p>
        <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#vermas"
          (click)="mostrarver(articulo)">Ver más </button>
      </div>
    </div>
  </div>


<!-- Modal para ver mas infomracion  -->
<div class="modal fade" *ngIf="modalvisible" id="vermas" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel"> {{articuloSeleccionado.nombre}}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <img src="{{articuloSeleccionado.imagen}}" alt="{{articuloSeleccionado.alt}}">
      </div>
      <div class="mb-3">
        {{articuloSeleccionado.descripcion}}
      </div>

      <div class="mb-3">

        {{articuloSeleccionado.precio}}
      </div>
    </div>
  </div>
</div>
