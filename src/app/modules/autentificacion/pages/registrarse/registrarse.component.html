<div class="container">
    <div class="row">
      <h1><strong>Registrarse</strong></h1>
  
      <mat-radio-group aria-label="Select an option">
        <form class="example-form">
          <mat-form-field  appearance="outline" class="example-full-width">
            <mat-label>Ingrese su nombre</mat-label>
            <input class="input" [(ngModel)]="usuario.nombre" matInput placeholder="Ej: pepitoperez2022@gmail.com"
              required>
          </mat-form-field>
        </form>
      &nbsp;
  </mat-radio-group>

      <!-- Apellido de usuario -->
     
      <mat-radio-group aria-label="Select an option">
        <form class="example-form">
          <mat-form-field  appearance="outline" class="example-full-width">
            <mat-label>Ingrese su apellido</mat-label>
            <input class="input" [(ngModel)]="usuario.apellido" matInput placeholder="Ej: pepitoperez2022@gmail.com"
              required>
          </mat-form-field>
        </form>
      &nbsp;
  </mat-radio-group>
  
      <!--Gmail de usuario -->
     <mat-radio-group aria-label="Select an option">
        <form class="example-form">
          <mat-form-field  appearance="outline" class="example-full-width">
            <mat-label>Ingrese un gmail</mat-label>
            <input class="input" [(ngModel)]="usuario.email" matInput placeholder="Ej: pepitoperez2022@gmail.com"
              required>
          </mat-form-field>
        </form>
      &nbsp;
  </mat-radio-group>
  
      <!-- Rol de usuario -->
      <mat-form-field>
        <mat-label>Seleccione rol de usuario:</mat-label>
        <select [(ngModel)]="usuario.rol" matNativeControl required>
          <option value="admin">Administrador</option>
          <option value="vist">Visitante</option>
        </select>
  
      </mat-form-field>
  
  
      <!-- Contraseña de usuario -->

      <mat-radio-group aria-label="Select an option">
        <form class="example-form">
          <mat-form-field appearance="outline" class="example-full-width">
        <mat-label>Ingrese su contraseña:</mat-label>
        <input [(ngModel)]="usuario.password" matInput [type]="hide ? 'password' : 'text'" #input minlength="6" required>
        <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide">
          <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-hint align="start">Mínimo:6/{{input.value.length}}</mat-hint>
      </mat-form-field>
    </form>
    &nbsp;
  </mat-radio-group>
  
  
      <!-- Botón para ENVIAR la información a la Base de Datos-->
      <button class="button" mat-raised-button  (click)="registrar()"><b>Registrar</b></button>
    </div>
  </div>
