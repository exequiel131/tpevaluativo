<!--FORMULARIO-->
<form class="form">

  <p id="heading">Iniciar Sesión</p>

<!--AGREGAR NOMBRE DE USUARIO-->
  <div class="field">
    <i class="material-icons" style="font-size: 20px;">person</i>
    <!--Input para agregar el nombre de usuario-->
    <input autocomplete="off" [(ngModel)]="inicio.email" placeholder="Nombre de usuario" class="input-field" type="text">
  </div>

<!--AGREGAR CONTRASEÑA-->
  <div class="field">
    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
      viewBox="0 0 16 16">
      <path
        d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z">
      </path>
    </svg>
    <!--INPUT PARA LA CONTRASEÑA-->
    <input placeholder="Contraseña" [(ngModel)]="inicio.password" matInput [type]="hide ? 'password' : 'text'" required class="input-field" type="password">
  </div>

  <!--BOTONES-->
  <div class="btn"  >
    <button class="button1" (click)="iniciarsesion()">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Empezar&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</button>
    <button class="button2">Registrarse</button>
  </div>
  <button class="button3">Olvidé mi contraseña</button>
</form>
