<!-- Formulario de inicio de sesión -->
<form class="form">
  <p id="heading">Iniciar Sesión</p>

  <!--FORMULARIO EMAIL-->
  <div class="field">
    <i class="material-icons" style="font-size: 18px;">person</i>
    <input [(ngModel)]="inicio.email" name="email" autocomplete="off" placeholder="pepitoperez2022@gmail.com" class="input-field"
      type="text">
  </div>

  <!--FORMULARIO CONTRASEÑA-->
  <div class="field">
    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
      viewBox="0 0 16 16">
      <path
        d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z">
      </path>
    </svg>
    <input [(ngModel)]="inicio.password" name="password" placeholder="Contraseña" class="input-field" type="password">
  </div>
  <div class="btn">
    <button class="button1" (click)="iniciarsesion()">Iniciar Sesión</button>
  </div>
  <div class="btn">
    <button class="button2" routerLink="/registro">Registrarse</button>
  </div>
  <div class="btn">
    <a class="button3" [routerLink]="['/reset-password']">Olvidé mi contraseña</a>
    </div>
  
</form>
